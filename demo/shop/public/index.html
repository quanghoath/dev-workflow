<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo shop · Cart</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1b1f24; }
  li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e3e6ea; }
  button { font: inherit; padding: 10px 18px; border: 0; border-radius: 8px; background: #2f5bd3; color: #fff; cursor: pointer; margin-top: 16px; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { margin-top: 16px; min-height: 1.5em; }
</style>
</head>
<body>
<h1>Your cart</h1>
<ul id="cart"></ul>
<p>Total: <strong id="total">0</strong> USD</p>
<button id="place" type="button">Place order</button>
<p id="msg" role="status"></p>
<script>
  const cart = [{ productId: 1, qty: 1 }, { productId: 2, qty: 1 }];
  let submitting = false;

  async function load() {
    const products = await (await fetch("/api/products")).json();
    const byId = Object.fromEntries(products.map((p) => [p.id, p]));
    document.getElementById("cart").innerHTML = cart
      .map(({ productId, qty }) => `<li><span>${byId[productId].name} × ${qty}</span><span>${byId[productId].price * qty} USD</span></li>`)
      .join("");
    document.getElementById("total").textContent = cart.reduce((s, { productId, qty }) => s + byId[productId].price * qty, 0);
  }

  document.getElementById("place").addEventListener("click", async () => {
    if (submitting) return;
    // BUG (demo): the flag is set only after a delay, so a fast double-click sends two orders
    setTimeout(() => { submitting = true; }, 300);
    const btn = document.getElementById("place");
    const msg = document.getElementById("msg");
    const res = await fetch("/api/orders", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: cart }),
    });
    const body = await res.json();
    msg.textContent = res.ok ? `Order placed: #${body.id}` : body.error;
    btn.disabled = res.ok;
  });

  load();
</script>
</body>
</html>
